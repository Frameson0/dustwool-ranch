<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Dustwool Ranch - a semi-idle colony builder in the browser.">
<meta name="theme-color" content="#22262a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dustwool">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Dustwool Ranch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&family=PT+Sans+Narrow:wght@400;700&display=swap">
<style>
/* Layout: full-screen map canvas. Gate wall on the left, plot grid to the right, overview sidebar on the right edge, tabs along the bottom. Deliberately single dark theme like a colony-sim UI. */
:root{
  --ground:#16191b;
  --panel:rgba(30,34,38,.95);
  --edge:#5a6168;
  --edge-soft:#3a4046;
  --text:#ddddd5;
  --dim:#9ba19b;
  --hi:#f3e7a0;
  --good:#8fc46a;
  --bad:#d86a52;
  --warn:#d8b14a;
  --btn:#3a4046;
  --btn-top:#464d54;
  --btn-hover:#535b63;
  --bar:#c9a640;
  --side:290px;
  --r:6px;
  --ui:'Arimo',Arial,'Helvetica Neue',sans-serif;
  --narrow:'PT Sans Narrow','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--text);font:13px/1.35 var(--ui);user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#gfx{position:fixed;inset:0;width:100%;height:100%;display:none;pointer-events:none;z-index:0}
.ov{position:fixed;z-index:5}
button{font:inherit;color:var(--text);background:linear-gradient(var(--btn-top),var(--btn));border:1px solid var(--edge);padding:4px 10px;cursor:pointer;border-radius:var(--r)}
button:hover:not([disabled]){background:var(--btn-hover);color:var(--hi)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
button[disabled]{opacity:.45;cursor:default}
select,input{font:inherit;color:var(--text);background:#2a2f34;border:1px solid var(--edge);padding:3px 6px;border-radius:var(--r);max-width:100%}
input[type=number]{width:72px;font-variant-numeric:tabular-nums}
.pane{background:var(--panel);border:1px solid var(--edge);box-shadow:0 4px 18px rgba(0,0,0,.5);border-radius:10px}
h3{margin:0;font:700 15px/1.2 var(--ui);text-wrap:balance}
h4{margin:0;font:700 11px/1 var(--narrow);letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.lbl{font:700 11px/1 var(--narrow);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}

#side{right:0;top:0;bottom:calc(36px + env(safe-area-inset-bottom,0px));width:var(--side);display:flex;flex-direction:column;border-left:1px solid var(--edge);background:var(--panel);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
#side .sect{padding:10px 12px;border-bottom:1px solid var(--edge-soft);display:flex;flex-direction:column;gap:6px}
#side .scroll{overflow:auto;flex:1;min-height:0}
#side .site b{font-size:14px}
.spd{display:flex;gap:3px}
.spd button{padding:3px 7px;display:flex;align-items:center}
.spd button.on{background:#5a636b;border-color:var(--hi)}
.spd svg{height:12px;fill:currentColor}
.eco{display:grid;grid-template-columns:20px 1fr auto auto;gap:2px 6px;align-items:center;font-size:12.5px}
.eco img{width:20px;height:20px}
.eco .n{text-align:right;font-variant-numeric:tabular-nums}
.eco .rate{text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;min-width:64px}
.grp{border:1px solid var(--edge-soft);border-radius:8px;background:rgba(0,0,0,.14);overflow:hidden}
.grp>.gh{display:grid;grid-template-columns:14px 1fr auto;gap:6px;align-items:center;padding:6px 8px;cursor:pointer}
.grp>.gh:hover{background:rgba(255,255,255,.04)}
.grp>.gh small{display:block;color:var(--dim);font-size:11px}
.grp .chev{transition:transform .15s;color:var(--dim)}
.grp.open .chev{transform:rotate(90deg)}
.grp .gb{padding:0 8px 6px 28px;display:flex;flex-direction:column}
.plotrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:4px 0;border-top:1px solid rgba(255,255,255,.05)}
.plotrow .nm{cursor:pointer;min-width:0}
.plotrow .nm:hover{color:var(--hi)}
.plotrow small{display:block;color:var(--dim);font-size:11px}
.plotrow button,.grp .gh button{padding:2px 7px;font-size:12px;white-space:nowrap}
#sidetoggle{right:max(8px,env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px))}
#ovbtn{right:calc(var(--side) + 10px);bottom:calc(46px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:7px;padding:6px 12px;background:rgba(40,45,50,.92);box-shadow:0 2px 10px rgba(0,0,0,.45)}
#ovbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ovbtn.on{border-color:var(--hi);color:var(--hi)}
body.side-hidden #ovbtn{right:max(10px,env(safe-area-inset-right,0px))}
body.side-hidden #side{display:none}
body:not(.side-hidden) #sidetoggle{display:none}

#pawnbar{left:calc((100% - var(--side))/2);transform:translateX(-50%);top:calc(6px + env(safe-area-inset-top,0px));display:flex;gap:4px;max-width:calc(100% - var(--side) - 120px);overflow-x:auto}
body.side-hidden #pawnbar{left:50%}
.pw{width:58px;flex:none;display:flex;flex-direction:column;align-items:center;cursor:grab;padding:2px 0 3px;border:1px solid transparent;background:rgba(20,22,24,.62);border-radius:8px;touch-action:none}
.pw:hover{border-color:var(--edge)}
.pw.sel{border-color:var(--hi)}
.pw img{width:48px;height:48px;pointer-events:none}
.pw span{font-size:11px;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px #000}
.pw i{font-style:normal;font-size:9.5px;color:var(--dim);max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw.empty{cursor:default;opacity:.65;justify-content:center;font-size:10px;color:var(--dim);height:68px;text-align:center;padding:0 4px}

#msgs{left:max(10px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:min(420px,calc(100% - var(--side) - 40px))}
#msgs div{background:rgba(15,17,19,.8);padding:3px 9px;font-size:12.5px;text-shadow:0 1px 1px #000;border-radius:6px}
#letters{right:calc(var(--side) + 10px);top:calc(90px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end}
body.side-hidden #letters{right:max(10px,env(safe-area-inset-right,0px))}
.letter{display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;cursor:pointer;color:var(--text);text-shadow:0 1px 2px #000,0 0 3px #000}
.letter:hover{background:none;color:var(--hi)}
.letter svg{width:38px;height:28px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.letter span{font-size:12.5px;max-width:200px;text-align:right}

#tabs{left:0;right:0;bottom:0;display:flex;gap:4px;background:#22262a;border-top:1px solid var(--edge);padding:3px max(4px,env(safe-area-inset-right,0px)) calc(3px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
#tabs button{flex:1;height:30px;background:linear-gradient(#383e43,#2c3135);font:700 12px var(--narrow);letter-spacing:.08em;text-transform:uppercase;padding:0 4px;border-color:var(--edge-soft)}
#tabs button.on{background:#4c535a;color:var(--hi);border-color:var(--edge)}
#panel{left:max(6px,env(safe-area-inset-left,0px));bottom:calc(42px + env(safe-area-inset-bottom,0px));width:min(600px,calc(100vw - 12px));max-height:calc(100% - 140px);overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
#panel>*,#inspect>*{flex-shrink:0}
#inspect{z-index:7}
.bcat{margin-top:4px}
#inspect{left:max(6px,env(safe-area-inset-left,0px));bottom:calc(42px + env(safe-area-inset-bottom,0px));width:min(410px,calc(100vw - 12px));max-height:calc(100% - 140px);overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
body.panel-open #inspect{left:min(614px,calc(100vw - 416px))}
#hint{left:calc((100% - var(--side))/2);transform:translateX(-50%);bottom:calc(48px + env(safe-area-inset-bottom,0px));background:rgba(15,17,19,.88);padding:5px 12px;font-size:12.5px;border:1px solid var(--edge-soft);border-radius:8px}

.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--edge);padding:1px 8px;font-size:11.5px;background:#2b3035;border-radius:10px}
.chip.ok{border-color:#5f7f45;color:var(--good)}.chip.no{border-color:#7a4a3e;color:var(--bad)}
.bar{height:8px;background:#121416;border:1px solid #3c4248;position:relative;flex:1;min-width:60px;border-radius:5px;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--bar)}
.bar.green>i{background:#6f9a4d}.bar.blue>i{background:#5c8bb0}
.skill{display:grid;grid-template-columns:86px 14px 22px 1fr;align-items:center;gap:6px;font-size:12.5px}
.skill .lv{text-align:right;font-variant-numeric:tabular-nums}
.skill svg{width:12px;height:14px}
.skill .bar{height:12px}
.skill .bar>i{background:rgba(220,220,210,.22)}
.portrait{width:56px;height:56px;background:#15181b;border:1px solid var(--edge-soft);border-radius:8px}
table{border-collapse:collapse;width:100%}
td,th{padding:4px 6px;text-align:left;font-size:12.5px;border-bottom:1px solid var(--edge-soft)}
th{font:700 11px var(--narrow);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td img{width:20px;height:20px;vertical-align:middle}
.tablewrap{overflow-x:auto}
.build{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.build button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:6px 9px;text-align:left}
.build small{color:var(--dim);font-size:11px;line-height:1.3}
.proj{border:1px solid var(--edge-soft);padding:8px 10px;display:flex;flex-direction:column;gap:5px;background:rgba(0,0,0,.15);border-radius:8px}
.proj.cur{border-color:var(--hi)}
.proj.done{opacity:.6}
.biomes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.biome{border:1px solid var(--edge);padding:10px;display:flex;flex-direction:column;gap:6px;background:rgba(0,0,0,.18);border-radius:10px}
.biome ul{margin:0;padding-left:16px;font-size:12px;line-height:1.4}
.swatch{height:26px;border:1px solid var(--edge-soft);border-radius:6px}

#modalwrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#modal{width:min(800px,100%);max-height:calc(100% - 20px);overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
#modal p{margin:0;max-width:64ch;line-height:1.5}
#modal.narrow{width:min(560px,100%)}
@media (min-width:700px){body:not(.side-hidden) #modalwrap{padding-right:calc(var(--side) + 16px)}body:not(.side-hidden) #tut{left:calc((100% - var(--side))/2)}}
#modal.narrow p{max-width:none}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols2>div{min-width:0}
.req{border:1px solid var(--warn);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:rgba(216,177,74,.07)}
#ghost{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-50%)}
#ghost img{width:44px;height:44px;opacity:.85}
@media (max-width:900px){:root{--side:256px}}
@media (max-width:700px){
  #ovbtn{right:max(10px,env(safe-area-inset-right,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  .cols2{grid-template-columns:1fr}
  #side{width:min(300px,86vw);z-index:8}
  #sidetoggle{z-index:9;top:auto;bottom:calc(48px + env(safe-area-inset-bottom,0px))}
  #pawnbar,body.side-hidden #pawnbar{left:50%;max-width:calc(100% - 20px);top:auto;bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  #letters,body.side-hidden #letters{right:max(10px,env(safe-area-inset-right,0px))}
  body.panel-open #inspect{display:none}
}
@media (prefers-reduced-motion:reduce){.grp .chev{transition:none}}
/* cinematic */
#cine{position:fixed;inset:0;z-index:60;cursor:pointer;color:#eee}
#cine .bar{position:absolute;left:0;right:0;height:0;background:#050505;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
#cine.on .bar{height:10vh}#cine .bt{top:0}#cine .bb{bottom:0}
#cine .ctitle{position:absolute;top:13vh;left:0;right:0;text-align:center;font:700 42px/1.1 var(--narrow);letter-spacing:.14em;text-transform:uppercase;color:var(--hi);text-shadow:0 2px 14px rgba(0,0,0,.9);opacity:0;transform:translateY(-12px);transition:opacity 1.2s,transform 1.2s}
#cine .ctitle small{display:block;font:400 13px var(--ui);letter-spacing:.32em;color:#d8d0b0;margin-bottom:6px}
#cine .ctitle.show{opacity:1;transform:none}
#cine .ccard{position:absolute;left:4vw;bottom:14vh;min-width:260px;background:rgba(18,20,22,.84);border:1px solid var(--edge);border-radius:10px;padding:14px 18px;opacity:0;transform:translateX(-24px);transition:opacity .9s,transform .9s}
#cine .ccard.show{opacity:1;transform:none}
#cine .ccard h4{margin-bottom:8px}
#cine .ccard>div{display:flex;justify-content:space-between;gap:28px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}
#cine .ccard.show>div{animation:crow .5s both}
#cine .ccard>div:nth-of-type(2){animation-delay:.12s}#cine .ccard>div:nth-of-type(3){animation-delay:.24s}#cine .ccard>div:nth-of-type(4){animation-delay:.36s}#cine .ccard>div:nth-of-type(5){animation-delay:.48s}#cine .ccard>div:nth-of-type(6){animation-delay:.6s}#cine .ccard>div:nth-of-type(7){animation-delay:.72s}
@keyframes crow{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
#cine .sub{position:absolute;bottom:calc(10vh + 14px);left:0;right:0;text-align:center;font:italic 15px var(--ui);color:#e8e2c8;opacity:0;transition:opacity .8s;text-shadow:0 1px 6px #000}
#cine .sub.show{opacity:1}
#cine .fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1.2s;pointer-events:none}
#cine .fade.show{opacity:1}
#cine .cnew{position:absolute;left:50%;top:50%;transform:translate(-50%,-42%);opacity:0;transition:opacity 1s,transform 1.4s;text-align:center;width:min(560px,90vw)}
#cine .cnew.show{opacity:1;transform:translate(-50%,-50%)}
#cine .cnew small{display:block;font:400 13px var(--ui);letter-spacing:.32em;text-transform:uppercase;color:#bbb}
#cine .cnew b{display:block;font:700 48px/1.1 var(--narrow);letter-spacing:.1em;text-transform:uppercase;color:var(--hi);margin:6px 0}
#cine .cnew .bn{font-size:15px;color:#ddd}
#cine .cnew ul{list-style:none;padding:0;margin:14px 0 0;font-size:13px;line-height:1.6}
#cine .cnew li.p{color:var(--good)}#cine .cnew li.c{color:#e0a080}
#cine .cskip{position:absolute;right:22px;bottom:calc(10vh + 12px);font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.12em;text-transform:uppercase}
body.cine .ov{opacity:0!important;pointer-events:none!important;transition:opacity .6s}
/* tooltip */
#tip{position:fixed;z-index:70;max-width:250px;background:rgba(22,24,26,.97);border:1px solid var(--edge);border-left:3px solid var(--hi);border-radius:6px;padding:7px 10px;font-size:12px;line-height:1.4;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.5);animation:tipin .14s ease-out}
@keyframes tipin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.chip[data-tip]{cursor:help;border-bottom:1px dotted rgba(243,231,160,.5)}
/* UI motion */
.pane.pop{animation:pop .24s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
#msgs>div.new{animation:toast .38s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes toast{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.letter.new{animation:lpop .55s cubic-bezier(.2,.9,.3,1.45) both}
@keyframes lpop{from{opacity:0;transform:translateX(34px) scale(.8)}to{opacity:1;transform:none}}
button{transition:background .15s,color .15s,transform .08s,box-shadow .15s}
button:active:not([disabled]){transform:scale(.96)}
.build button:hover:not([disabled]){transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.35)}
#tabs button.on{box-shadow:inset 0 -3px 0 var(--hi)}
#modal{animation:pop .26s cubic-bezier(.2,.9,.3,1.15)}
/* tutorial */
#tut{left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100vw - 24px));padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--hi);z-index:8}
#tut.pop{animation:tutpop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes tutpop{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%)}}
#tut .dots{display:flex;gap:4px}#tut .dots i{width:7px;height:7px;border-radius:50%;background:#4a5056}#tut .dots i.d{background:var(--good)}#tut .dots i.c{background:var(--hi)}
#tut .ok{color:var(--good);font-weight:700;animation:pop .3s}
.tut-hl{animation:tuthl 1.2s ease-in-out infinite!important}
@keyframes tuthl{0%,100%{box-shadow:0 0 0 2px rgba(243,231,160,.85)}50%{box-shadow:0 0 0 2px #fff6c8,0 0 14px 4px rgba(243,231,160,.55)}}

/* ===== work list ===== */
.wk{display:flex;flex-direction:column;gap:4px}
.wk-head{display:grid;grid-template-columns:1fr;gap:4px;position:sticky;top:-12px;background:var(--panel);z-index:1;padding:2px 0}
.wk-head .wk-n{justify-self:start;padding:2px 8px;font-size:11.5px}
.wk-g{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
html body .wk-head .wk-g button{padding:4px 0;min-height:0;min-width:0;overflow:hidden;white-space:nowrap;font:700 11px var(--narrow);letter-spacing:0}
html body .wk-head .wk-n{padding:2px 10px;min-height:0;font-size:11.5px}
.wk-head button.on{border-color:var(--hi);color:var(--hi);background:#4c535a}
.wk-row{display:flex;flex-direction:column;gap:3px;padding:5px 6px;border:1px solid var(--edge-soft);border-radius:8px;background:rgba(255,255,255,.02)}
.wk-top{display:flex;align-items:center;gap:6px;min-width:0}
.wk-top img{width:24px;height:24px;flex:none}
.wk-top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.wk-top select{max-width:58%;font-size:12px;padding:2px 4px}
.wk-row .wk-g span{position:relative;text-align:center;font:600 12px var(--ui);font-variant-numeric:tabular-nums;padding:2px 0;border-radius:4px;background:linear-gradient(to top,rgba(201,166,64,.32) var(--f),rgba(255,255,255,.04) var(--f))}
.wk-row .wk-g span.on{outline:1px solid var(--hi);color:var(--hi)}
.wk-row .wk-g i{position:absolute;top:-3px;right:1px;font-style:normal;font-size:9px;color:#e8a040;letter-spacing:-1px}
/* ===== chronicle / stats / saves ===== */
.chron{display:flex;flex-direction:column;gap:3px}
.chron h4{margin-top:8px}
.ce{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.35}
.ce i{font-style:normal;width:18px;flex:none;text-align:center;color:var(--hi)}
.ce-raid i{color:#e08a6a}.ce-people i{color:#8ab4d8}.ce-research i{color:#b8a0e0}.ce-boss i{color:#e05a4a}.ce-exp i{color:#8fc46a}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}

/* ================= storage ================= */
function cellsOf(type,key){const out=[];for(const p of built(type)){const[ox,oy]=plotOrigin(p);for(const[x,y]of layouts[p.id][key])out.push([ox+x,oy+y,p])}return out}

function stockCap(){if(S.test)return 1e9;let c=0;for(const p of built('storage'))c+=layouts[p.id].store.length*tierDef(p).per*clusterBonus(p);c+=tableCells().length*25+kitchenCells().length*25+shelfCells().length*30;for(const r in bonusInfo)c+=bonusInfo[r].store;return Math.floor(c*(biome().storage||1))}

function armSpot(){const a=armories()[0];if(a)return[a.x0+Math.floor(a.w/2),a.y0+Math.floor(a.h/2)];const st=storeCells()[0];return st?[st[0],st[1]]:null}

function releaseJob(c){
  const j=c.job;
  if(j){
    if(j.t==='harvest'){const p=S.plants[j.x+','+j.y];if(p&&p.r===c.id)p.r=0}
    if(j.t==='sow')sowRes.delete(j.x+','+j.y);
    if(j.t==='tend'){const a=aniById(j.aid);if(a&&a.r===c.id)a.r=0}
    if(j.t==='pick'||j.t==='collect'){const g=S.ground.find(g=>g.id===j.gid);if(g&&g.r===c.id)g.r=0}
    if(j.t==='gather'){const o=S.outside.find(o=>o.id===j.oid);if(o&&o.r===c.id)o.r=0}
    if(j.t==='hunt'&&j.aid){const a=S.wild.find(a=>a.id===j.aid);if(a&&a.r===c.id)a.r=0}
  }
  if(j&&j.extra){for(const[i,m]of j.extra){add(i,m);flow(i,m)}j.extra=null}
  if(c.hold){for(const[i,n]of c.hold.all){add(i,n);flow(i,n)}c.hold=null}
  c.hunting=false;
  if(c.carcass){const w=WILD[c.carcass];add('meat',w.meat);add('leather',w.leather);c.carcass=null}
  if(c.load&&c.load.length&&!isHauler(c)){for(const l of c.load){add(l.i,l.n);flow(l.i,l.n)}c.load=[]}
  c.job=null;c.path=[];c.sleeping=false;c.loafing=false;c.em=null;
}
function assignTargetName(id){if(id==='out')return'Gathering outside';if(id==='build')return'clearing new land';if(id==='guard'||(typeof id==='string'&&id.startsWith('g:')))return'guard duty on the wall';const p=plotById(id);return p?plotLabel(p):'—'}
function assign(c,pid){
  if(c.assign===pid)return true;
  if(typeof pid==='string'&&pid.startsWith('g:'))pid='guard';
  if(c.assign===pid)return true;
  const toGuard=pid==='guard';
  if(pid!==null&&pid!=='out'&&pid!=='build'&&!toGuard){
    const p=plotById(pid);
    if(!p||!slots(p)){msg(p&&p.type?`${plotName(p)} needs no workers.`:'Build something on this plot first.','bad');return false}
    if(workersOf(pid).filter(o=>o!==c).length>=slots(p)){msg(`${plotName(p)} is full (${slots(p)} worker${slots(p)>1?'s':''}). Upgrade it for more slots.`,'bad');return false}
  }
  const wasGuard=isGuard(c);releaseJob(c);c.assign=pid;c.post=null;c.stationKey=null;c.eqT=0;
  const toHunt=typeof pid==='number'&&plotById(pid)&&plotById(pid).type==='hunting';
  if(wasGuard&&!toGuard)unequip(c,toHunt&&c.weapon&&RANGED.includes(c.weapon));
  else if(!toHunt&&!toGuard){if(c.weapon){add(c.weapon,1);c.weapon=null}if(c.melee){add(c.melee,1);c.melee=null}}
  msg(`${c.nick}: ${pid!==null?'now '+(pid==='out'?'gathers outside the walls':pid==='build'?'clearing new land':toGuard?'on '+assignTargetName(pid):'works at '+assignTargetName(pid)):'unassigned'}.`);
  return true;
}
function plotLabel(p){return plotName(p)+(p.type==='farm'||p.type==='hydro'?' ('+CROPS[p.crop].n+')':'')}
function nearest(c,list,fn){let best=null,bd=1e9;for(const it of list){const[x,y]=fn(it),d=Math.abs(x+.5-c.x)+Math.abs(y+.5-c.y);if(d<bd){bd=d;best=it}}return best}
function cropCells(p){const[ox,oy]=plotOrigin(p);return layouts[p.id].crops.map(([x,y])=>[ox+x,oy+y])}

function newJob(c){
  if(c.recover>0)return{t:'sleep',st:0,recover:true};
  if(outOfGrid(c))return{t:'comeback'};
  if(c.carcass)return{t:'hunt',st:'home'};
  if(c.load&&c.load.length&&isHauler(c))return{t:'unload',st:0};
  if(isNight())return{t:'sleep',st:0};
  if(c.carry)return{t:'haul',st:0};
  if(c.food<.35&&commons()&&(cnt('meal')>=1||cnt('finemeal')>=1))return{t:'eat',st:0};
  if(c.assign==='out')return gatherJob(c)||{t:'loaf',st:0};
  if(c.assign==='build')return buildJob(c)||restJob(c,null,c.status);
  const p=c.assign!==null?plotById(c.assign):null;
  if(p&&!p.type){c.assign=null}
  if(p&&p.type==='construction'){const rp=repairFor(c);if(rp)return{t:'repair',...rp,st:0};const cj=conJob(c);if(cj)return cj;if(S.proj){const bj=buildJob(c);if(bj)return bj}return restJob(c,p,'Nothing to build right now')}
  if(p&&GROW_TYPES.includes(p.type))return growJob(c,p)||restJob(c,p,c.status);
  if(p&&p.type==='hunting')return huntJob(c,p)||restJob(c,p,c.status);
  if(p&&p.type==='pen')return penJob(c,p)||restJob(c,p,'Nothing to tend right now');
  if(p&&CRAFT_TYPES.includes(p.type))return craftJob(c,p)||restJob(c,p,c.status);
  if(p&&p.type==='quarry'){if(paused(p)){c.status=pauseText(p);return restJob(c,p,c.status)}return{t:'mine',pid:p.id,st:0,p:0,sti:freeStation(c,p)}}
  if(p&&p.type==='research'){if(!S.research.cur)return restJob(c,p,'No research project selected');return{t:'research',pid:p.id,st:0}}
  if(p&&p.type==='storage'){if(c.load&&c.load.length)return{t:'unload',st:0};return haulJob(c,p)||restJob(c,p,c.status)}
  if(!hasConstructors()){const cj=conJob(c);if(cj)return cj}
  const rp=repairNeeded();if(rp)return{t:'repair',...rp,st:0};
  return wanderJob(c,commons(),'Idle');

const LIMIT_TYPES=['farm','hydro','treefarm','kitchen','workshop','tailor','weaponsmith','armorsmith','hunting','quarry','refinery','munitions','fabrication'];
function quarryOres(p){const o=['stone'];const d=tierDef(p);for(const x of d.ores||[]){if(x==='plasteel'&&!(S.site.biome==='mountain'||S.site.biome==='tundra'||S.site.biome==='cave'))continue;o.push(x)}return o}
function quarryOre(p){const o=quarryOres(p);return o.includes(p.prod)?p.prod:'stone'}
function limitItem(p){if(p.type==='quarry')return quarryOre(p);if(GROW_TYPES.includes(p.type))return CROPS[p.crop].item;if(p.type==='hunting')return'meat';if(BILLS[p.type])return null;if(p.type==='quarry')return'stone';return null}
function hasLimit(p){return p.limit!==undefined&&p.limit!==null&&p.limit!==''}
function paused(p){if(!hasLimit(p)||BILLS[p.type])return false;const i=limitItem(p);return i&&cnt(i)>=p.limit}
function pauseText(p){const i=limitItem(p);return`Paused: ${fmt(cnt(i))} ${ITEMS[i].n.toLowerCase()} in stock (limit ${p.limit})`}
function growJob(c,p){
  if(paused(p)){c.status=pauseText(p);return null}
  if(p.type==='farm'&&biome().nofarm){c.status='No soil here. Only hydroponics works.';return null}
  const cells=cropCells(p);
  const ripe=cells.filter(([x,y])=>{const q=S.plants[x+','+y];return q&&q.g>=1&&!q.r});
  if(ripe.length){const t=nearest(c,ripe,a=>a);S.plants[t[0]+','+t[1]].r=c.id;return{t:'harvest',x:t[0],y:t[1],st:0,p:0,pid:p.id}}
  const crop=CROPS[p.crop];
  if(!owns(p.crop)){c.status=`No ${crop.n.toLowerCase()} seeds. Buy them once from a trader.`;return null}
  const empty=cells.filter(([x,y])=>!S.plants[x+','+y]&&!sowRes.has(x+','+y));
  if(!empty.length){c.status='Tending growing crops';return null}
  const t=nearest(c,empty,a=>a);sowRes.set(t[0]+','+t[1],c.id);
  return{t:'sow',x:t[0],y:t[1],st:0,p:0,crop:p.crop,pid:p.id};
}
function penJob(c,p){
  const eggs=haulers().length?[]:S.ground.filter(g=>g.pen===p.id&&g.lay&&!g.r);
  if(eggs.length){const g=nearest(c,eggs,g=>[g.x,g.y]);g.r=c.id;return{t:'pick',gid:g.id,x:g.x,y:g.y,st:0,p:0}}

  if(ready.length){const a=nearest(c,ready,a=>[Math.floor(a.x),Math.floor(a.y)]);a.r=c.id;return{t:'tend',aid:a.id,st:0,p:0,pid:p.id}}

function gatherJob(c){
  const woodFull=S.woodLimit!==undefined&&S.woodLimit!==null&&cnt('wood')>=S.woodLimit;
  const list=S.outside.filter(o=>o.mark&&!o.r&&(o.k==='chunk'?S.t-o.land>3:o.k==='rock'?true:o.g>=1&&!woodFull));
  if(!list.length)return null;
  const o=nearest(c,list,o=>[o.x,o.y]);o.r=c.id;return{t:'gather',oid:o.id,st:0,p:0};
}
/* ---- bills: each crafting building keeps an ordered list of bills.
   b={id,r:recipe,mode:'until'|'count'|'forever',n,done,off}. Workers take the first bill that can run. */
function bills(p){if(!p.bills){p.bills=[];if(BILLS[p.type]){const r=BILLS[p.type].includes(p.bill)?p.bill:BILLS[p.type][0];p.bills.push({id:nid(),r,mode:hasLimit(p)?'until':'forever',n:hasLimit(p)?p.limit:20,done:0});p.limit=null}}return p.bills}
function billBusy(b){let n=0;for(const c of S.cols)if(c.job&&c.job.t==='craft'&&c.job.bid===b.id)n++;return n}
function billWhy(p,b){const rec=RECIPES[b.r];if(!rec)return'Unknown recipe';if(b.off)return'Suspended';if(rec.req&&!done(rec.req))return'Needs research: '+reqName(rec.req);if((rec.tier||0)>p.tier)return'Needs a tier '+(rec.tier+1)+' building';
  if(b.mode==='until'&&cnt(rec.out)+billBusy(b)*rec.outN>=b.n)return`Target reached (${fmt(cnt(rec.out))} in stock)`;if(b.mode==='count'&&(b.done||0)+billBusy(b)>=b.n)return'Done';
  if(!localIngr(p,rec)&&!pickIngr(rec))return'Waiting for ingredients ('+rec.d+')';return null}
/* ---- input racks: tier 2+ crafting buildings keep ingredients next to the benches (p.stock, outside main storage) */
function rackCap(p){return CRAFT_TYPES.includes(p.type)&&!p.small?[0,60,100,150,200][p.tier]||0:0}
function rackUsed(p){let n=0;for(const i in p.stock||{})n+=p.stock[i];for(const c of S.cols){const j=c.job;if(j&&j.t==='craft'&&j.pid===p.id&&j.extra)for(const[i,m]of j.extra)n+=m}return n}
function localIngr(p,rec){if(!p.stock)return null;const out=[];for(const s of rec.in){let best=null;for(const i of s.any)if((p.stock[i]||0)>=s.n&&(!best||p.stock[i]>p.stock[best]))best=i;if(!best)return null;out.push([best,s.n])}return out}
function rackReturn(p){for(const i in p.stock||{})if(p.stock[i]>0)add(i,p.stock[i]);p.stock={}}
function pickIngr(rec){const out=[];for(const s of rec.in){let best=null;for(const i of s.any)if(cnt(i)>=s.n&&(!best||cnt(i)>cnt(best)))best=i;if(!best)return null;out.push([best,s.n])}return out}
function freeStation(c,p){const L=layouts[p.id],used=new Set(S.cols.filter(o=>o!==c&&o.job&&o.job.pid===p.id&&o.job.sti!==undefined).map(o=>o.job.sti));for(let i=0;i<L.stations.length;i++)if(!used.has(i))return i;return 0}
function craftJob(c,p){
  const L=bills(p);if(!L.length){c.status='No bills. Add one in the building panel.';return null}
  let first=null;for(const b of L){const why=billWhy(p,b);if(!why){const rec=RECIPES[b.r];if(!localIngr(p,rec)&&!storeCells().length){c.status='No storage plot';return null}p.bill=b.r;return{t:'craft',pid:p.id,st:0,p:0,sti:freeStation(c,p),rk:b.r,bid:b.id}}if(!first)first=RECIPES[b.r].n+': '+why.toLowerCase()}
  c.status=L.every(b=>/^(Done|Target|Suspended)/.test(billWhy(p,b)))?'All bills done or paused':first;return null;
}
function restJob(c,p,reason){
  if(!hasConstructors()&&!isConstructor(c)){const cj=conJob(c);if(cj)return cj}
  const rp=repairNeeded();if(rp)return{t:'repair',...rp,st:0};
  const cp=commons();
  if(!cp)return wanderJob(c,p,reason);
  const j=wanderJob(c,cp,null);c.status='Relaxing at the '+plotName(cp).toLowerCase()+(reason?' \u00b7 '+reason:'');j.w=R(5,9);return j;
}
function wanderJob(c,p,status){
  let cells=[];
  if(p){const[ox,oy]=plotOrigin(p);for(let k=0;k<8;k++){const x=ox+RI(0,P-1),y=oy+RI(0,P-1);if(walkable(x,y))cells.push([x,y])}
    if(p.type==='commons'){const L=layouts[p.id];cells=L.seats.map(([x,y])=>[ox+x,oy+y])}}
  else if(c.assign==='out'){for(let k=0;k<10;k++){const x=RI(Math.max(0,GX-7),GX-2),y=GATE_Y+RI(-3,3);if(walkable(x,y))cells.push([x,y])}}
  else{const cx=Math.floor(c.x),cy=Math.floor(c.y);for(let k=0;k<14;k++){const x=cx+RI(-4,4),y=cy+RI(-4,4);if(walkable(x,y)&&kind[x+y*W]===2&&owned[x+y*W]<0)cells.push([x,y])}}
  if(status)c.status=status;
  if(!cells.length)return{t:'wait',w:2};
  const t=pick(cells);return{t:'wander',x:t[0],y:t[1],st:0,w:R(3,7),social:!!(p&&p.type==='commons')};
}
function eatInPlace(c){
  if(c.food>.35)return;
  if(c.food>.15&&commons()&&(cnt('meal')>=1||cnt('finemeal')>=1))return;
  for(const i of['finemeal','meal']){if(cnt(i)>=1){take(i,1);flow(i,-1);c.food+=ITEMS[i].food;c.buff=1;return}}
  for(const i of['potato','rice','corn','egg']){while(c.food<.9&&cnt(i)>=1){take(i,1);flow(i,-1);c.food+=ITEMS[i].food}if(c.food>=.9){c.buff=1;return}}
}
function updCol(c,dt){
  c.food=Math.max(0,c.food-dt/DAY);eatInPlace(c);
  if(c.bub&&S.t>c.bub.until)c.bub=null;
  if(c.recover>0)c.recover-=dt;

    case 'haul':{
      if(!c.carry){c.job=null;return}
      if(j.st===0&&!isHauler(c)&&haulers().length){
        const d=dropCell(c,c.carry.i);
        if(d){if(!goTo(c,d[0],d[1])){c.wait=2;return}j.st=1;j.drop=d;c.status='Leaving '+ITEMS[c.carry.i].n.toLowerCase()+' at the pickup pile';return}
      }
      if(j.drop){addGround(c.carry.i,c.carry.n,j.drop[0],j.drop[1],j.drop[2]);c.carry=null;c.job=null;if(c.carry2){c.carry=c.carry2;c.carry2=null;c.job={t:'haul',st:0}}break}
      if(j.st===0){
        const st=nearest(c,haulTargets(c.carry.i),a=>a);
        if(!st){c.status='No storage plot to haul to';c.wait=3;if(S.t-(S.noStoreWarn||-99)>60){S.noStoreWarn=S.t;msg('Your colonists need a storage plot.','bad')}return}
        if(!goTo(c,st[0],st[1])){c.wait=2;return}
        j.st=1;c.status='Hauling '+ITEMS[c.carry.i].n.toLowerCase();return;
      }
      if(stockUsed()+c.carry.n>stockCap()){c.status='Storage full';c.wait=3;if(S.t-(S.fullWarn||-99)>60){S.fullWarn=S.t;msg('Storage is full. Sell goods or upgrade storage.','bad')}return}
      add(c.carry.i,c.carry.n);flow(c.carry.i,c.carry.n);c.carry=null;c.job=null;if(c.carry2){c.carry=c.carry2;c.carry2=null;c.job={t:'haul',st:0}}
      break;}
    case 'collect':{
      const g=S.ground.find(g=>g.id===j.gid);if(!g){c.job=(c.load&&c.load.length)?{t:'unload',st:0}:null;return}
      if(j.st===0){if(!goTo(c,g.x,g.y)){g.r=0;c.job=null;c.wait=2;return}j.st=1;c.status='Collecting '+ITEMS[g.i].n.toLowerCase();return}
      c.load=c.load||[];const room=haulCap(c)-loadSize(c),n=Math.min(room,g.n);
      if(n>0){const l=c.load.find(l=>l.i===g.i);if(l)l.n+=n;else c.load.push({i:g.i,n});g.n-=n}
      g.r=0;if(g.n<=0)S.ground=S.ground.filter(x=>x!==g);
      gainXP(c,'hauling',1);
      if(haulCap(c)-loadSize(c)>0){const more=S.ground.filter(o=>!o.r&&Math.abs(o.x-c.x)+Math.abs(o.y-c.y)<9);if(more.length){const o=nearest(c,more,o=>[o.x,o.y]);o.r=c.id;c.job={t:'collect',gid:o.id,st:0};return}}
      c.job={t:'unload',st:0};break;}
    case 'unload':{
      if(!c.load||!c.load.length){c.job=null;return}
      if(j.st===0){const st=nearest(c,storeCells(),a=>a);if(!st){c.status='No storage plot';c.wait=3;return}if(!goTo(c,st[0],st[1])){c.wait=2;return}j.st=1;c.status='Hauling '+loadSize(c)+' goods to storage';return}
      const free=stockCap()-stockUsed();if(free<=0){c.status='Storage full';c.wait=3;if(S.t-(S.fullWarn||-99)>60){S.fullWarn=S.t;msg('Storage is full. Sell goods or upgrade storage.','bad')}return}
      let room=free;for(const l of c.load){const n=Math.min(room,l.n);add(l.i,n);flow(l.i,n);l.n-=n;room-=n}
      c.load=c.load.filter(l=>l.n>0);gainXP(c,'hauling',4);
      if(!c.load.length)c.job=null;break;}
  }
}
function researchOK(r){return(!r.pre||done(r.pre))&&(!r.era||era()>=r.era)&&(!r.items||S.research.paid&&S.research.paid[r.id])}
function researchCanPay(r){if(!r.items)return true;for(const k in r.items)if(cnt(k)<r.items[k])return false;return true}
function startResearch(id){const r=RESEARCH.find(x=>x.id===id);if(!r||done(id))return;if(r.era&&era()<r.era){msg(`${r.n} needs the ${ERAS[r.era]} era. Move the colony to a new site first.`,'bad');return}if(r.pre&&!done(r.pre)){msg('First research '+reqName(r.pre)+'.','bad');return}
  if(r.items&&!(S.research.paid&&S.research.paid[id])){if(!researchCanPay(r)){msg('This research needs '+Object.keys(r.items).map(k=>r.items[k]+' '+ITEMS[k].n.toLowerCase()).join(' and ')+'.','bad');return}for(const k in r.items)take(k,r.items[k]);S.research.paid=S.research.paid||{};S.research.paid[id]=true}
  S.research.cur=id}
function completeResearch(pr){
  chron('research',`Researched ${pr.n}.`);S.research.done[pr.id]=true;S.research.prog[pr.id]=pr.cost;
  const next=RESEARCH.find(r=>!done(r.id)&&researchOK(r));
  S.research.cur=next?next.id:null;
  letter('info','Research complete',`${pr.n} is done. ${pr.d}${next?` Researchers moved on to ${next.n}.`:''}`);
}

/* ================= expansion ================= */
function lockedAdj(p){return !!p&&!p.open&&[[-1,0],[1,0],[0,-1],[0,1]].some(([a,b])=>{const n=nb(p,a,b);return n&&n.open})}
function openCount(){return S.plots.filter(p=>p.open).length}
function rockPlot(p){if(!p||!biome().cave)return false;const[ox,oy]=plotOrigin(p);return mtnAt(ox+2,oy+2)}
function expandCost(p){const n=openCount(),rk=rockPlot(p)?2.5:1;return{cost:Math.round(50*Math.pow(1.3,Math.max(0,n-4))*rk),mat:{...(S.wall<0?{}:[{},{wood:30},{stone:40},{stone:40,steel:10}][S.wall])}}}
function plotObstacles(p){const[ox,oy]=plotOrigin(p);return S.outside.filter(o=>(o.k==='tree'||o.k==='rock')&&o.x>=ox-GU-3&&o.x<=ox+P+GU+2&&o.y>=oy-GU-3&&o.y<=oy+P+GU+2)}
function startExpansion(p){
  if(S.proj){if(S.proj.pid!==p.id)msg('Your builders are already clearing other land.','bad');return S.proj.pid===p.id}
  if(!lockedAdj(p)){msg('Only land right next to your base can be cleared.','bad');return false}
  const c=expandCost(p);if(!costOk(c)){msg(`Clearing this land needs ${costStr(c)}.`,'bad');return false}
  const rk=rockPlot(p);pay(c);const obs=plotObstacles(p).length;S.proj={pid:p.id,prog:0,need:rk?320:80+obs*9,obs0:obs,paid:c,rock:rk};plotDirty=true;
  if(!S.cols.some(x=>x.assign==='build'))msg('Land marked for clearing. Drag colonists onto it to make them builders.','good');else msg('Your builders head out to clear the new land.','good');
  return true;
}
function cancelExpansion(){if(!S.proj)return;refundCost(S.proj.paid,1);S.proj=null;for(const c of S.cols)if(c.job&&c.job.t==='build')releaseJob(c);plotDirty=true;msg('Clearing cancelled. Costs refunded.')}
function completeExpansion(){
  const p=plotById(S.proj.pid),rk=S.proj.rock;S.proj=null;p.open=true;if(rk){add('stone',90);if(Math.random()<.5)add('steel',12);msg('The builders dug a new chamber out of the rock. 90 stone went to storage.','good')}
  for(const c of S.cols)if(c.job&&c.job.t==='build')releaseJob(c);
  refreshSite();msg(`New land opened up. ${openCount()} plots inside the wall now.`,'good');chron('land',`Cleared new land: ${openCount()} plots.`);
}
function buildJob(c){
  if(!S.proj){c.status='No land to clear. Click wild land next to the base.';return null}
  const p=plotById(S.proj.pid),[ox,oy]=plotOrigin(p),obs=plotObstacles(p).filter(o=>o.x>=ox-GU&&o.x<=ox+P+GU-1&&o.y>=oy-GU&&o.y<=oy+P+GU-1);
  let cell=null;
  if(obs.length&&S.proj.prog<.6){const o=nearest(c,obs,o=>[o.x,o.y]);cell=[o.x+(Math.random()<.5?-1:1),o.y]}
  const rk=S.proj.rock,okc=q=>q&&walkable(q[0],q[1])&&(rk?isBaseK(kAt(q[0],q[1])):kAt(q[0],q[1])===0);
  for(let k=0;k<(rk?60:14)&&!okc(cell);k++)cell=rk?[ox+RI(-GU-4,P+GU+3),oy+RI(-GU-4,P+GU+3)]:[ox+RI(-GU,P+GU-1),oy+RI(-GU,P+GU-1)];
  if(!okc(cell))return null;if(rk)c.status='Digging into the rock';
  return{t:'build',x:cell[0],y:cell[1],st:0,w:R(6,10)};
}

/* ================= animals ================= */
function newAnimal(type,x,y,pen,age){return{id:nid(),type,x,y,pen,age:age??ANIMALS[type].adult+R(0,100),p:R(0,.6),hun:0,r:0,path:[],wt:R(0,3),face:Math.random()<.5?'l':'r'}}
function penUsed(p){let s=0;for(const a of S.ani)if(a.pen===p.id)s+=ANIMALS[a.type].space;return s}
function penCap(p){return Math.round(tierDef(p).cap*clusterBonus(p))}
function updAni(a,dt){
  const d=ANIMALS[a.type];
  a.age+=dt;
  a.hun+=d.eat*(biome().hay||1)/60*dt;while(a.hun>=1&&cnt('hay')>=1){take('hay',1);flow('hay',-1);a.hun-=1}
  if(a.hun>3)a.hun=3;
  const fed=a.hun<2;
  if(a.age>=d.adult){a.p=Math.min(1,a.p+dt/d.ptime*(fed?1:.4));if(d.ground&&a.p>=1){a.p=0;layEgg(a)}}
  if(a.r)return;
  if(a.path&&a.path.length){stepMove(a,dt,d.speed);return}
  a.wt-=dt;
  if(a.wt<=0){const p=plotById(a.pen);if(p&&p.type==='pen'){const[ox,oy]=plotOrigin(p);a.path=[[ox+RI(0,P-1),oy+RI(1,P-1)]]}a.wt=R(3,10)}
}
function layEgg(a){
  const x=Math.floor(a.x),y=Math.floor(a.y),p=plotById(a.pen);if(!p||!inPlot(p,x,y))return;
  const g=S.ground.find(g=>g.x===x&&g.y===y&&g.i==='egg'&&!g.r);
  if(g)g.n++;else S.ground.push({id:nid(),i:'egg',n:1,x,y,pen:p.id,r:0,lay:true});
}
function tickPens(dt){
  for(const p of built('pen')){
    p.breed=p.breed||{};
    const rancher=workersOf(p.id).length>0;
    for(const type in ANIMALS){
      const d=ANIMALS[type],adults=S.ani.filter(a=>a.pen===p.id&&a.type===type&&a.age>=d.adult);
      if(adults.length<2||!rancher||penUsed(p)+d.space>penCap(p))continue;
      p.breed[type]=(p.breed[type]||0)+dt*(done('breeding')?2:1);
      if(p.breed[type]>=d.gest){p.breed[type]=0;const m=pick(adults);S.ani.push(newAnimal(type,m.x,m.y,p.id,0));msg(`A ${d.n.toLowerCase()} was born.`,'good');S.stats.born=(S.stats.born||0)+1}
    }
  }
}

/* ================= events ================= */
function promoCost(){return 60+40*S.cols.length}
function promote(tr){const c=promoCost();if(!tr||tr.promo||S.silver<c)return;S.silver-=c;tr.promo=true;S.promoBoost=true;S.nextWanderer=Math.min(S.nextWanderer,S.t+R(25,60));msg(`${tr.name} will tell travellers about your colony. Expect a wanderer at the gate soon.`,'good')}
function caravanGap(){return R(220,320)*(biome().caravan||1)*(1-.08*Math.max(0,S.wall))}
function tickEvents(dt){
  const req=S.requests.find(r=>!r.arrived&&S.t>=r.at);
  if(req&&!S.trader&&!S.raid){req.arrived=true;arriveCaravan(req)}
  if(!S.trader&&!S.raid&&S.t>=S.nextCaravan)arriveCaravan();
  if(S.trader&&S.raid&&S.vis.some(v=>v.shelter))S.trader.until=Math.max(S.trader.until,S.t+30);
  if(S.trader&&S.t>=S.trader.until){
    msg(`The ${S.trader.name} caravan is leaving.`);
    if(S.trader.req){const r=S.requests.find(r=>r.id===S.trader.req);if(r){msg(`Request from ${r.f} went unfilled.`,'bad');S.requests=S.requests.filter(x=>x!==r)}}
    S.trader=null;S.nextCaravan=S.t+caravanGap();
    for(const v of S.vis)if(v.k==='caravan'||v.k==='pack')sendAway(v);
    if(modal&&modal.k==='trade'&&modal.who==='caravan')closeModal();
  }
  if(S.trader&&hasTradeSpot()&&S.t-(S.trader.lastAuto||0)>10){S.trader.lastAuto=S.t;autoTrade(S.trader,true)}
  if(hasComms()&&!S.orbital&&S.t>=S.nextOrbital)arriveOrbital();
  if(S.orbital&&S.t>=S.orbital.until){{const pp=padPos();if(pp)ships.push({t:4.5,x:pp[0],y:pp[1],kind:'shuttle'})}msg(`Orbital trader ${S.orbital.name} has left orbit.`);S.orbital=null;S.nextOrbital=S.t+R(380,520);if(modal&&modal.k==='trade'&&modal.who==='orbital')closeModal()}
  if(S.orbital&&hasTradeSpot()&&S.t-(S.orbital.lastAuto||0)>10){S.orbital.lastAuto=S.t;autoTrade(S.orbital,true)}
  if(!S.wanderer&&!S.raid&&S.t>=S.nextWanderer)arriveWanderer();
  if(S.wanderer&&S.t>=S.wanderer.until)wandererLeaves();
  if(hasComms()&&S.t>=S.nextContract){if(S.contracts.length<3)newContract();S.nextContract=S.t+R(150,240)}
  if(S.t>=S.nextRequest){if(S.requests.filter(r=>!r.arrived).length<2)newRequest();S.nextRequest=S.t+R(2.5,4)*DAY}
  if(S.t>=S.nextChunk){if(S.outside.filter(o=>o.k==='chunk').length<3)dropChunk();S.nextChunk=S.t+R(1.4,2.4)*DAY}
  for(const o of S.outside)if(o.k==='tree'&&o.g<1)o.g=Math.min(1,o.g+dt/(2*DAY));
  S.contracts=S.contracts.filter(k=>k.until>S.t);
  S.letters=S.letters.filter(l=>!((l.k==='raid'&&!S.raid)||(l.k==='trade'&&!S.trader)||(l.k==='orbital'&&!S.orbital)||((l.k==='contract'||l.k==='chunk')&&S.t-(l.t||0)>DAY)));
}
function genStock(orbital){
  const seeds=['haygrass','rice'];
  if(orbital||Math.random()<.6)seeds.push('corn');
  if(done('cotton')&&(orbital||Math.random()<.7))seeds.push('cotton');
  const animals={chicken:RI(2,5)};
  if(orbital||Math.random()<.6)animals.goat=RI(1,3);
  if(orbital||Math.random()<.4)animals.shaggox=RI(1,2);
  const goods=orbital?{comp:RI(4,10),steel:RI(40,100),plasteel:Math.random()<.7?RI(10,40):0,chemfuel:RI(20,60),mechpart:Math.random()<.5?RI(2,4):0,datadisk:Math.random()<.35?1:0}:{wood:RI(40,120),stone:RI(20,60),steel:RI(30,90),leather:Math.random()<.5?RI(10,30):0,comp:Math.random()<.6?RI(1,4):0,chemfuel:Math.random()<.4?RI(10,30):0,seeds:Math.random()<.3?RI(1,2):0,datadisk:Math.random()<.15?1:0};
  return{seeds,animals,goods};
}
function autoSell(tr,quiet){
  let total=0;const sold=[];
  for(const i in S.autoSell){const keep=S.autoSell[i];if(keep===null||keep===undefined||keep==='')continue;const n=Math.floor(cnt(i)-keep);if(n<=0)continue;const v=n*ITEMS[i].v*priceMul(tr)*BAL.sell;take(i,n);S.silver+=v;flow('silver',v);total+=v;sold.push(`${n} ${ITEMS[i].n.toLowerCase()}`)}
  if(total>0){if(!quiet||total>20)msg(`Auto-sold ${sold.join(', ')} for ${fmt(total)} silver.`,'good');S.stats.earned=(S.stats.earned||0)+total}
}
function autoTrade(tr,quiet){if(!hasTradeSpot())return;autoSell(tr,quiet);autoBuy(tr,quiet)}
function autoBuy(tr,quiet){
  const res=S.buyReserve??200;let spent=0;const got=[];
  for(const i in S.autoBuy){const want=S.autoBuy[i];if(want===null||want===undefined)continue;const have=tr.stock.goods[i]||0;if(!have)continue;
    const price=ITEMS[i].v*1.4,n=Math.min(have,Math.floor(want-cnt(i)),Math.floor((S.silver-res)/price));if(n<=0)continue;
    S.silver-=n*price;tr.stock.goods[i]-=n;add(i,n);spent+=n*price;got.push(`${n} ${ITEMS[i].n.toLowerCase()}`)}
  if(spent>0&&(!quiet||spent>20))msg(`Auto-bought ${got.join(', ')} for ${fmt(spent)} silver.`,'good');
}
function roadEntry(){const pts=outerRoad;let i=0;for(let k=0;k<pts.length;k++)if(pts[k][0]<=GX-4)i=k;return{i,p:pts[i]}}
function sendAway(v){v.leaving=true;v.em=null;v.shelter=false;v.hide=false;const e=roadEntry(),x=clamp(Math.floor(e.p[0]),0,W-1),y=clamp(Math.floor(e.p[1]),0,H-1);if(!goTo(v,x,y))v.path=[];v.walkOut=outerRoad.slice(0,e.i+1).reverse()}
function arriveByRoad(v,k){const e=roadEntry();v.x=outerRoad[0][0]-k*1.1;v.y=outerRoad[0][1]+(k%2)*.5;v.walk=outerRoad.slice(1,e.i+1).map(p=>[p[0],p[1]+(k%2?.45:0)]);v.path=[]}
function raidWarnVisitors(){
  if(S.trader){
    const vs=S.vis.filter(v=>v.k==='caravan'||v.k==='pack');
    if(hasTradeSpot()){const sp=wpOfType('tradespot')[0],cells=[];for(let y=sp.y0;y<sp.y0+sp.h;y++)for(let x=sp.x0;x<sp.x0+sp.w;x++)cells.push([x,y]);
      vs.forEach((v,k)=>{const c=cells[(k*2+1)%cells.length];v.shelter=true;v.em=null;goTo(v,c[0],c[1])});
      msg(`The ${S.trader.name} caravan takes shelter at your trade spot.`)}
    else{msg(`The ${S.trader.name} caravan packs up and leaves before the raid. A trade spot would give them shelter.`,'warn');S.trader.until=S.t}
  }
  if(S.wanderer){const v=S.vis.find(v=>v.id===S.wanderer.p.id);if(v){const trees=S.outside.filter(o=>o.k==='tree'&&o.g>=.4&&o.x<GX-1&&Math.abs(o.y-GATE_Y)<10);const t=trees.length?nearest(v,trees,o=>[o.x,o.y]):null;
    if(t){v.hide=true;v.em=null;if(!goTo(v,t.x,t.y)){v.x=t.x+.5;v.y=t.y+.5}msg(`${S.wanderer.p.nick} hides behind a tree outside the wall.`)}}}
}
function raidOverVisitors(){
  for(const v of S.vis){
    if(v.shelter){v.shelter=false;if(v.home)goTo(v,v.home[0],v.home[1])}
    if(v.hide){v.hide=false;goTo(v,GX-2,GATE_Y-1)}
  }
}
function spawnCaravanPawns(atSpot){
  for(let k=0;k<3;k++){
    const p=genPawn();p.pack=k===1;
    const v={k:'caravan',id:p.id,look:p,x:atSpot?GX-4.5+k*.9:.5,y:GATE_Y+2.5+(k%2)*.6,path:[],face:'r',emT:R(1,4),home:[GX-5+k,GATE_Y+2+(k%2)]};
    if(!atSpot)arriveByRoad(v,k);
    S.vis.push(v);
  }
  const a={k:'pack',id:nid(),x:atSpot?GX-2.5:.5,y:GATE_Y+3.6,path:[],face:'r',type:'shaggox',age:999,emT:R(2,5),home:[GX-3,GATE_Y+3]};
  if(!atSpot)arriveByRoad(a,3);

function arriveCaravan(req){
  S.trader={kind:'caravan',name:req?req.f:pick(FACTIONS),until:S.t+(req?200:150),mul:.85,stock:genStock(false),req:req?req.id:null};
  spawnCaravanPawns(false);autoTrade(S.trader);
  letter('trade',req?'Requested caravan':'Trade caravan',req?`The ${req.f} caravan is here for the ${req.n} ${ITEMS[req.i].n.toLowerCase()} they asked for. They pay ${Math.round(req.mult*100)}% of value.`:`A caravan from ${S.trader.name} is waiting outside your gate. They buy goods and sell seeds, animals, wood and stone.${S.reloc===0?' They also sell the wagon convoy you need to move on (World tab).':''}`,{who:'caravan'});
}
function arriveOrbital(){
  S.orbital={kind:'orbital',name:pick(ORBITAL),until:S.t+260,t0:S.t,mul:1.1,stock:genStock(true)};
  autoTrade(S.orbital);
  letter('orbital','Orbital trader',`${S.orbital.name} answers your comms tower and lands a shuttle on your pad. Click it to trade. Orbital traders pay more, sell components and plasteel and charter shuttles to new sites.`,{who:'orbital'});
}
function arriveWanderer(){
  const p=genPawn(pick(SKILLS));if(S.promoBoost){S.promoBoost=false;const k=pick(SKILLS);p.sk[k]=Math.max(p.sk[k],RI(9,14));p.pa[k]=2}
  const v={k:'wanderer',id:p.id,look:p,x:.5,y:GATE_Y-1.5,path:[],face:'r',emT:3,home:[GX-2,GATE_Y-1]};arriveByRoad(v,0);
  S.wanderer={p,until:S.t+160};S.vis.push(v);
  const best=SKILLS.slice().sort((a,b)=>p.sk[b]-p.sk[a]).slice(0,2).map(s=>`${SKN[s]} ${p.sk[s]}`).join(', ');
  letter('join','Wanderer at the gate',`${colName(p)}, age ${p.age}, is standing at your gate and asks to join. Best at ${best}. Traits: ${p.traits.map(t=>TRAITS[t].n).join(', ')}.`,{pid:p.id});
}
function wandererLeaves(){
  const w=S.wanderer;if(!w)return;
  const v=S.vis.find(v=>v.id===w.p.id);if(v)sendAway(v);
  S.letters=S.letters.filter(l=>!(l.k==='join'&&l.data.pid===w.p.id));
  if(modal&&modal.k==='letter'&&modal.l.k==='join')closeModal();
  msg(`${w.p.nick} moved on.`);S.wanderer=null;S.nextWanderer=S.t+R(180,280)*BAL.join;
}
function acceptWanderer(){
  const w=S.wanderer;if(!w)return;

function upgradeText(p,n){
  const d=tierDef(p);
  switch(p.type){case 'housing':return`${d.beds} → ${n.beds} beds per plot${n.power?', needs '+n.power+' W power':''}`;case 'treefarm':return`Growth ${Math.round(d.grow*100)}% → ${Math.round(n.grow*100)}%, more trees`;case 'farm':case 'hydro':return`Growth ${Math.round(d.grow*100)}% → ${Math.round(n.grow*100)}%, more crop cells${n.note?' ('+n.note.toLowerCase()+')':''}${n.yield?', +25% yield':''}`;
    case 'pen':return`Space ${d.cap} → ${n.cap}${n.prod?', more products':''}${n.power?', needs '+n.power+' W power':''}`;
    case 'solar':return`${d.prod} → ${n.prod} W in daylight`;case 'burner':return`${d.prod} → ${n.prod} W day and night, burns ${n.fuel} wood per minute`;case 'battery':return`Stores ${fmt(d.store)} → ${fmt(n.store)} power`;
    case 'weaponsmith':case 'armorsmith':{const un=BILLS[p.type].filter(k=>(RECIPES[k].tier||0)===p.tier+1).map(k=>ITEMS[RECIPES[k].out].n.toLowerCase());return`Speed ${Math.round(d.speed*100)}% → ${Math.round(n.speed*100)}%${un.length?', unlocks '+un.join(', '):''}${n.power?', needs '+n.power+' W power':''}`}
    case 'quarry':return`Speed ${Math.round(d.speed*100)}% → ${Math.round(n.speed*100)}%${n.ores?', digs '+n.ores.filter(o=>o!=='plasteel'||S.site.biome==='mountain'||S.site.biome==='tundra'||S.site.biome==='cave').join(' and '):''}${n.power?', needs '+n.power+' W power':''}`;case 'storage':return`${d.per} → ${n.per} items per cell, haulers use ${n.cart} (${d.carry} → ${n.carry} goods per trip), +1 hauler slot`;case 'commons':return`Meal bonus +${Math.round((d.buff-1)*100)}% → +${Math.round((n.buff-1)*100)}%, more seats`;default:return(d.speed?`Speed ${Math.round(d.speed*100)}% → ${Math.round(n.speed*100)}%`:'')+(n.power?`, needs ${n.power} W power`:'')+(slots(p)&&p.tier<2?', +1 worker slot':'')}
}
function assignOptions(c){
  let o=`<option value="">Idle</option><option value="out" ${c.assign==='out'?'selected':''}>Gather outside (${workersOf('out').length})</option><option value="build" ${c.assign==='build'?'selected':''}>Clear land (${workersOf('build').length})</option>`;
  o+=`<option value="guard" ${isGuard(c)?'selected':''}>Guard the wall (${S.cols.filter(isGuard).length})</option>`;
  for(const o2 of wpWorkPlots()){const full=workersOf(o2.id).filter(x=>x!==c).length>=1;o+=`<option value="${o2.id}" ${c.assign===o2.id?'selected':''} ${full&&c.assign!==o2.id?'disabled':''}>${esc(plotName(o2))} (wall, ${workersOf(o2.id).length}/1)</option>`}
  for(const p of S.plots)if(slots(p)){const full=workersOf(p.id).filter(x=>x!==c).length>=slots(p);o+=`<option value="${p.id}" ${c.assign===p.id?'selected':''} ${full&&c.assign!==p.id?'disabled':''}>${esc(plotLabel(p))} (${workersOf(p.id).length}/${slots(p)})</option>`}
  return o;
}

function storyHTML(){const t=Math.min(1,(S.story&&S.story.tension||0)/1.2),lv=STORY[opt('story')]||STORY.normal,m=(S.mods||[]).filter(x=>x.until>S.t);return`<div class="storybar"><span>Storyteller: <b>${lv.n}</b></span><span class="tens" title="Tension: rises after bad events and raids, calms over time. High tension holds back bad events."><i style="width:${Math.round(t*100)}%;background:${t>.66?'#d86a52':t>.33?'#d8b14a':'#8fc46a'}"></i></span><span class="dim">${t>.66?'Tense':t>.33?'Uneasy':'Calm'}</span>${m.map(x=>`<span class="chip">${esc(x.n)} · ${Math.ceil((x.until-S.t)/DAY*24)}h</span>`).join('')}</div>`}

function sparkSVG(vals,col,fmtf){if(vals.length<2)return'<div class="dim" style="font-size:12px">Not enough data yet: one point per in-game hour.</div>';const W0=300,H0=70,mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1,pts=vals.map((v,i)=>`${(i/(vals.length-1)*W0).toFixed(1)},${(H0-4-(v-mn)/rg*(H0-10)).toFixed(1)}`).join(' ');

  const P={},U={};for(const x of H0){for(const k in x.p)P[k]=(P[k]||0)+x.p[k];for(const k in x.u)U[k]=(U[k]||0)+x.u[k]}

/* risky actions need a second tap within 3 s (the button turns red and says so) */
const CONFIRM=new Set(['demolish','demolane','demowp','demoslot','demogate','demotrap','sella','relocate','slotdel','slotload','saveimport','payraid','xback','cancelexp','reject','upgradeall','perk','lodel','cancelcon']);
let armKey=null,armT=0;
function confirmGate(el,a){if(!CONFIRM.has(a)&&!el.dataset.confirm)return true;const key=[a,el.dataset.id,el.dataset.v,el.dataset.s,el.dataset.wid].join('|');
  if(armKey===key&&performance.now()-armT<3000){armKey=null;return true}
  armKey=key;armT=performance.now();if(!el.dataset.lbl)el.dataset.lbl=el.innerHTML;el.classList.add('armed');el.innerHTML=(MOB||isTouch?'Tap':'Click')+' again to confirm';sfx('click');
  setTimeout(()=>{if(el.isConnected&&el.dataset.lbl){el.classList.remove('armed');el.innerHTML=el.dataset.lbl;delete el.dataset.lbl}},3000);return false}
function act(el){

  switch(a){
    case 'tab':{const inModal=!!el.closest('#modal,#inspect'),prev=tab;tab=tab===v&&!inModal?null:v;
      if(tab==='defense'&&prev!=='defense'){defMode=true;ovMode=false;camAnim=defTarget()}
      else if(prev==='defense'&&tab!=='defense'&&!raidActive()){defMode=false;autoDef=false;camAnim=normTarget()}resetArm=false;if(el.closest('#modal'))closeModal();break}
    case 'side':document.body.classList.toggle('side-hidden');clampCam();break;

let pointer=null;
function tileAt(cx,cy){const[wx,wy]=s2w(cx,cy);return[Math.floor(wx/T),Math.floor(wy/T)]}
function colAt(wx,wy){for(const c of S.cols){if(c.sleeping)continue;if(Math.hypot(c.x*T-wx,(c.y-.3)*T-wy)<T*.45)return c}return null}
function entAt(wx,wy){
  const c=colAt(wx,wy);if(c)return{k:'col',id:c.id};
  if(S.orbital){const pp=padPos();if(pp&&Math.hypot(wx/T-pp[0],wy/T-pp[1])<1.3)return{k:'shuttle'}}
  for(const v of S.vis){const r=v.k==='pack'?T*.7:T*.45;if(Math.hypot(v.x*T-wx,(v.y-.3)*T-wy)<r)return{k:'vis',id:v.id}}
  for(const a of S.ani){const r=a.type==='shaggox'?T*.7:T*.4;if(Math.hypot(a.x*T-wx,(a.y-.3)*T-wy)<r)return{k:'ani',id:a.id}}
  for(const a of S.wild){if(Math.hypot(a.x*T-wx,(a.y-.1)*T-wy)<T*.5)return{k:'wild',id:a.id}}
  const x=Math.floor(wx/T),y=Math.floor(wy/T);
  for(const sl of wallSlots())if(Math.hypot(sl.x+.5-wx/T,sl.y+.5-wy/T)<.75)return{k:'slot',id:sl.id};
  {const tk=trapAt(x,y);if(tk!==null)return{k:'trap',key:tk}}
  for(const o of S.outside)if(Math.abs(o.x+.5-wx/T)<.7&&Math.abs(o.y+.2-wy/T)<.8)return{k:'out',id:o.id};
  const k=kAt(x,y);
  if(k===4)return{k:'gate',cell:x+y*W};
  if(k===1){let best=null,bd=2.3;for(const sl of wallSlots()){const d=Math.hypot(sl.x-x,sl.y-y);if(d<bd){bd=d;best=sl}}return best?{k:'slot',id:best.id}:{k:'wall'}}
  if(k===5){const ws=wpAt(x,y);return ws?{k:'wp',key:ws.key}:null}
  if(k===2){const ls=laneAt(x,y);if(ls)return{k:'lane',key:ls.key}}
  const p=plotAt(x,y);if(p&&(p.open||(k===0&&S.proj&&S.proj.pid===p.id)))return{k:'plot',id:p.id};return null;
}

}

function frame(now){try{frameBody(now);errN=Math.max(0,errN-.05);goodFrames++;if(goodFrames===3)bootVerify()}catch(e){errN++;console.error(e);if(errN>4&&!crashShown){crashShown=true;bootFail('The game hit an error while drawing.',e)}}requestAnimationFrame(frame)}
function frameBody(now){
  const rdt=Math.min(.1,(now-last)/1000);last=now;
  if(camAnim){const k=1-Math.exp(-rdt*7);cam.z+=(camAnim.z-cam.z)*k;cam.x+=(camAnim.x-cam.x)*k;cam.y+=(camAnim.y-cam.y)*k;if(Math.abs(camAnim.z-cam.z)<.002&&Math.abs(camAnim.x-cam.x)<1&&Math.abs(camAnim.y-cam.y)<1){cam.z=camAnim.z;cam.x=camAnim.x;cam.y=camAnim.y;camAnim=null;clampCam()}}
  if(cine)cineUpdate(rdt);
  let gdt=(cine&&!cine.swapped)?0:rdt*[0,1,3,6][S.speed];while(gdt>0){const d=Math.min(.1,gdt);tick(d,false);gdt-=d}
  const pan=420*rdt/cam.z;let mv=false;
  if(keys['w']||keys['arrowup']){cam.y-=pan;mv=true}if(keys['s']||keys['arrowdown']){cam.y+=pan;mv=true}if(keys['a']||keys['arrowleft']){cam.x-=pan;mv=true}if(keys['d']||keys['arrowright']){cam.x+=pan;mv=true}
  if(mv){camAnim=null;clampCam()}
  render(rdt);try{gfxFrame(now,rdt)}catch(e){console.error(e);GFX.set.on=0;if(GFX.cv)GFX.cv.style.display='none'}audioFrame(rdt);drawExpWins(now);
  uiAcc+=rdt;if(uiAcc>.25){uiAcc=0;updateUI()}
  saveAcc+=rdt;if(saveAcc>15){saveAcc=0;save()}
}
const tipEl=document.createElement('div');tipEl.id='tip';tipEl.hidden=true;document.body.appendChild(tipEl);
document.addEventListener('pointerover',e=>{const el=e.target&&e.target.closest?e.target.closest('[data-tip]'):null;if(!el){tipEl.hidden=true;return}tipEl.innerHTML=el.dataset.tip;tipEl.hidden=false;const r=el.getBoundingClientRect(),h=tipEl.offsetHeight,w=tipEl.offsetWidth;tipEl.style.left=clamp(r.left,8,innerWidth-w-8)+'px';tipEl.style.top=(r.bottom+6+h>innerHeight?r.top-h-6:r.bottom+6)+'px'});
document.addEventListener('pointerdown',e=>{const el=e.target&&e.target.closest?e.target.closest('[data-tip]'):null;if(el&&e.pointerType!=='mouse'){tipEl.innerHTML=el.dataset.tip;tipEl.hidden=false;const r=el.getBoundingClientRect(),h=tipEl.offsetHeight,w=tipEl.offsetWidth;tipEl.style.left=clamp(r.left,8,innerWidth-w-8)+'px';tipEl.style.top=(r.top-h-6<8?r.bottom+6:r.top-h-6)+'px';return}tipEl.hidden=true},true);
const tutEl=document.createElement('div');tutEl.id='tut';tutEl.className='ov pane';tutEl.hidden=true;document.body.appendChild(tutEl);
function anyPlanned(t){return S.plots.some(p=>p.type===t||(p.con&&p.con.type===t))}
function freeStart(){return S.plots.find(p=>p.open&&!p.type&&!p.con)}
const TUT=[
  {t:'Welcome to Dustwool Ranch',b:()=>isTouch?'Three colonists and four cleared plots in the wilds. Drag with one finger to look around and pinch to zoom. Tap things to inspect them. This short guide walks you through the start. You can skip it any time.':'Three colonists and four cleared plots in the wilds. Drag the map (or use WASD) to look around and scroll to zoom. This short guide walks you through the start. You can skip it any time.',next:true},
  {t:'Plan a home',b:'Click one of the empty plots in the middle of the base.',done:()=>sel&&sel.k==='plot'&&plotById(sel.id)&&plotById(sel.id).open&&!plotById(sel.id).type,map:()=>({plot:freeStart()})},
  {t:'Beds first',b:'Pick <b>Makeshift barracks</b> in the list. Without beds colonists sleep rough and work slower.',done:()=>anyPlanned('housing'),dom:'[data-act="build"][data-v="housing"]',map:()=>({plot:freeStart()})},
  {t:'Food',b:'Click another empty plot and build a <b>Basic farm</b>. You start with potato seeds.',done:()=>anyPlanned('farm'),dom:'[data-act="build"][data-v="farm"]',map:()=>({plot:freeStart()})},
  {t:'A place for goods',b:'Build a <b>Stockpile</b> on a third plot. Harvests, wood and loot are stored there.',done:()=>anyPlanned('storage'),dom:'[data-act="build"][data-v="storage"]',map:()=>({plot:freeStart()})},
  {t:'Idle hands build',b:()=>`Colonists without a job build what you planned. Speed time up with the buttons ${MOB?'at the top':'at the top right'} and watch the plots go up.`,done:()=>built('housing').length&&built('farm').length&&built('storage').length,dom:'[data-act="speed"][data-v="2"]'},
  {t:'Hand out jobs',b:()=>`Drag a colonist portrait from the ${MOB?'bar at the bottom':'top bar'} onto the farm. They become a farmer and sow and harvest it.`,done:()=>S.cols.some(c=>{const p=typeof c.assign==='number'&&plotById(c.assign);return p&&p.type==='farm'}),dom:'#pawnbar',map:()=>({plot:built('farm')[0]})},
  {t:'Cooking',b:'Raw potatoes make poor food. Build a <b>Cooking fire</b> on the last free plot and drag a colonist there to cook meals.',done:()=>anyPlanned('kitchen'),dom:'[data-act="build"][data-v="kitchen"]',map:()=>({plot:freeStart()})},
  {t:'Dig in',b:'Raiders come after a few days. Click the dashed line around the base and dig a <b>trench</b>. It also gives you a gate in the west.',done:()=>S.wall>=0||!!S.wallCon,dom:'[data-act="wallup"]',map:()=>({wall:true})},
  {t:'Wood from outside',b:'Click a tree outside the base and mark it for chopping, or use <b>Mark all trees</b>. Idle colonists and gatherers bring the wood in.',done:()=>S.outside.some(o=>o.k==='tree'&&o.mark),dom:'[data-act="markall"]'},
  {t:'Research',b:'Open the <b>Research</b> tab at the bottom. A research corner and a researcher unlock new buildings, tiers and gear.',done:()=>tab==='research',dom:'#tab-research'},
  {t:'Growing the base',b:'Click wild land next to the base to clear it. Same buildings side by side join up, <span style="color:#e6d27a">★</span> shows neighbour bonuses, and the lanes between plots take wings (click a building to see where) or barricades and guard posts.',next:true},
  {t:'You are set',b:'Drag colonists onto the wall to make them guards, trade with caravans at the gate, and one day pack up and move to a bigger site from the World tab. Good luck!',next:true},
];
let tutKey='',tutOkT=0;
function updateTut(){const T0=S.tut;if(!T0||T0.done||cine){tutEl.hidden=true;document.querySelectorAll('.tut-hl').forEach(e=>e.classList.remove('tut-hl'));return}
  let st=TUT[T0.i];while(st&&!st.next&&st.done&&st.done()){T0.i++;tutOkT=performance.now();st=TUT[T0.i]}
  if(!st){T0.done=true;tutEl.hidden=true;msg('Tutorial finished.','good');return}
  const k=T0.i+'';const ok=performance.now()-tutOkT<1600;
  setHTML(tutEl,`<div class="between"><h4>Guide · ${T0.i+1}/${TUT.length}</h4><div class="dots">${TUT.map((_,i)=>`<i class="${i<T0.i?'d':i===T0.i?'c':''}"></i>`).join('')}</div></div>${ok&&T0.i>0?'<div class="ok">✓ Done</div>':''}<h3>${st.t}</h3><div>${typeof st.b==='function'?st.b():st.b}</div><div class="row" style="justify-content:flex-end">${st.next?`<button data-act="tutnext">${T0.i===TUT.length-1?'Finish':'Next'}</button>`:''}<button data-act="tutskip" style="opacity:.75">Skip guide</button></div>`);
  tutEl.hidden=false;if(k!==tutKey){tutKey=k;popEl(tutEl)}
  document.querySelectorAll('.tut-hl').forEach(e=>e.classList.remove('tut-hl'));if(st.dom)document.querySelectorAll(st.dom).forEach(e=>e.classList.add('tut-hl'))}
function drawTutMap(now){const T0=S.tut;if(!T0||T0.done||cine)return;const st=TUT[T0.i];if(!st||!st.map)return;const m=st.map();if(!m)return;const a=.55+.45*Math.sin(now/260);
  ctx.save();ctx.strokeStyle=`rgba(243,231,160,${a})`;ctx.lineWidth=3;ctx.setLineDash([10,6]);ctx.lineDashOffset=-now/40;
  if(m.plot){const[ox,oy]=plotOrigin(m.plot);rr(ctx,ox*T-6,oy*T-6,P*T+12,P*T+12,14);ctx.stroke()}
  if(m.wall){const b=baseBox();rr(ctx,b.x0*T-6,b.y0*T-6,(b.x1-b.x0)*T+12,(b.y1-b.y0)*T+12,16);ctx.stroke()}
  ctx.restore()}
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
function bootStep(m,f){const e=document.getElementById('bootmsg'),fi=document.getElementById('bootfill');if(e)e.textContent=m;if(fi&&f!==undefined)fi.style.width=Math.round(f*100)+'%'}
function bootHide(){const b=document.getElementById('boot');if(!b||b.classList.contains('out'))return;bootStep('Ready',1);b.classList.add('out');setTimeout(()=>{b.hidden=true},700)}
function bootFail(what,err){const b=document.getElementById('boot');if(!b)return;b.hidden=false;b.classList.remove('out');document.getElementById('booterr').hidden=false;
  document.getElementById('booterrtxt').textContent=what+'\n\n'+String(err&&(err.stack||err.message)||err||'').slice(0,900);bootStep('Something went wrong')}
function bootWire(){const on=(id,f)=>{const e=document.getElementById(id);if(e)e.addEventListener('click',f)};
  on('bootreload',()=>location.reload());
  on('bootgo',()=>{document.getElementById('booterr').hidden=true;bootHide()});
  on('bootbak',()=>{let raw=null;try{raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem(SAVE_KEY+'-backup')}catch(e){}if(!raw&&S)try{raw=serialize()}catch(e){}if(!raw){alert('No save found.');return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='dustwool-save-backup.json';document.body.appendChild(a);a.click();a.remove()});
  on('bootfresh',()=>{if(!confirm('Start a new colony? The old save is kept as a backup in this browser.'))return;try{const raw=localStorage.getItem(SAVE_KEY);if(raw)localStorage.setItem(SAVE_KEY+'-backup',raw);localStorage.removeItem(SAVE_KEY)}catch(e){}location.reload()})}
function bootVerify(){let ok=true;try{const d=ctx.getImageData(cv.width>>1,cv.height>>1,1,1).data;ok=!(d[3]===0||(d[0]+d[1]+d[2]<4))}catch(e){ok=true}
  if(ok){bootHide();return}
  if(LSmax>.4){LSmax=Math.max(.4,LS*.6);DPR=Math.min(DPR,1.5);resize();buildStatic();plotDirty=true;goodFrames=0;bootStep('Adjusting graphics for this device',.97);return}
  bootHide();msg('The map could not be drawn fully on this device. Try reloading.','bad')}
async function start(data){
  bootWire();
  try{
    bootStep('Checking your device',.05);
    if(!ctx)throw new Error('This browser cannot draw the game (no 2D canvas).');
    let storeOK=true;try{localStorage.setItem('dw-probe','1');localStorage.removeItem('dw-probe')}catch(e){storeOK=false}
    resize();setMob();if(innerWidth<700)document.body.classList.add('side-hidden');
    await nextFrame();
    bootStep('Loading fonts',.15);
    try{if(document.fonts&&document.fonts.ready)await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))])}catch(e){}
    bootStep('Loading your colony',.3);await nextFrame();
    let loaded=false,loadErr=null;
    const src=(data&&data.save)||(()=>{try{return localStorage.getItem(SAVE_KEY)}catch(e){return null}})();
    if(src){try{loaded=loadFrom(src)}catch(e){loaded=false;loadErr=e}}
    if(src&&!loaded){try{localStorage.setItem(SAVE_KEY+'-backup',src)}catch(e){}}
    if(!loaded)newGame();
    bootStep('Drawing the world',.5);await nextFrame();
    buildStatic();
    {let tries=0;while(tries<2){let okc=true;try{const sg=staticCv.getContext('2d'),d=sg.getImageData(staticCv.width>>1,staticCv.height>>1,1,1).data;okc=d[3]>0}catch(e){okc=true}if(okc)break;LSmax=Math.max(.35,LS*.6);buildStatic();tries++}}
    bootStep('Building the base',.65);await nextFrame();
    buildPlots();plotDirty=false;updateUI();fitCam();
    if(loaded&&!(data&&data.save)){await catchUp()}
    updateUI();
    if(src&&!loaded)letter('info','Save could not be loaded',`Your old save could not be opened${loadErr?' ('+String(loadErr.message||loadErr).slice(0,120)+')':''}, so a new colony started. The old save is kept as a backup in this browser; the start screen can download it.`);
    if(!storeOK)msg('This browser blocks storage: progress will not be saved.','bad');
    bootStep('Starting',.95);
  }catch(e){bootFail('The game could not start.',e);console.error(e);return}
  requestAnimationFrame(t=>{last=t;frame(t)});
}
addEventListener('resize',()=>{resize();clampCam()});
addEventListener('beforeunload',save);
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=performance.now();save()}else if(S&&staticCv&&performance.now()-hiddenAt>3000){try{buildStatic();plotDirty=true}catch(e){console.error(e)}}});
cv.addEventListener('contextrestored',()=>{if(S){buildStatic();plotDirty=true}});
window.claude?.hot?.snapshot?.(()=>({save:serialize()}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
